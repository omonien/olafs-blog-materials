<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1002" width="760" height="1002" role="img" aria-labelledby="t d"><title id="t">The same comparison with FireDAC</title><desc id="d">.NET (FirebirdClient, Npgsql), in the same runs, insert, durable, 1 client: Firebird 52.6 transactions per second, PostgreSQL 188 transactions per second, PostgreSQL 3.6 times as much; .NET (FirebirdClient, Npgsql), in the same runs, insert, durable, 8 clients: Firebird 358 transactions per second, PostgreSQL 891 transactions per second, PostgreSQL 2.5 times as much; .NET (FirebirdClient, Npgsql), in the same runs, pgbench read only, 1 client: Firebird 279 transactions per second, PostgreSQL 848 transactions per second, PostgreSQL 3.0 times as much; .NET (FirebirdClient, Npgsql), in the same runs, pgbench read only, 16 clients: Firebird 1,367 transactions per second, PostgreSQL 4,895 transactions per second, PostgreSQL 3.6 times as much; .NET (FirebirdClient, Npgsql), in the same runs, TPC-B like, 1 client: Firebird 12.2 transactions per second, PostgreSQL 62.3 transactions per second, PostgreSQL 5.1 times as much; .NET (FirebirdClient, Npgsql), in the same runs, TPC-B like, 16 clients: Firebird 69.7 transactions per second, PostgreSQL 324 transactions per second, PostgreSQL 4.6 times as much; FireDAC (Delphi 13) with default settings, insert, durable, 1 client: Firebird 74.8 transactions per second, PostgreSQL 294 transactions per second, PostgreSQL 3.9 times as much; FireDAC (Delphi 13) with default settings, insert, durable, 8 clients: Firebird 276 transactions per second, PostgreSQL 605 transactions per second, PostgreSQL 2.2 times as much; FireDAC (Delphi 13) with default settings, pgbench read only, 1 client: Firebird 245 transactions per second, PostgreSQL 117 transactions per second, Firebird 2.1 times as much; FireDAC (Delphi 13) with default settings, pgbench read only, 16 clients: Firebird 2,061 transactions per second, PostgreSQL 619 transactions per second, Firebird 3.3 times as much; FireDAC (Delphi 13) with default settings, TPC-B like, 1 client: Firebird 14.2 transactions per second, PostgreSQL 47.2 transactions per second, PostgreSQL 3.3 times as much; FireDAC (Delphi 13) with default settings, TPC-B like, 16 clients: Firebird 49.5 transactions per second, PostgreSQL 312 transactions per second, PostgreSQL 6.3 times as much; FireDAC with FetchOptions.CursorKind = ckDefault, pgbench read only, 1 client: Firebird 314 transactions per second, PostgreSQL 683 transactions per second, PostgreSQL 2.2 times as much; FireDAC with FetchOptions.CursorKind = ckDefault, pgbench read only, 16 clients: Firebird 1,704 transactions per second, PostgreSQL 2,691 transactions per second, PostgreSQL 1.6 times as much; FireDAC with FetchOptions.CursorKind = ckDefault, TPC-B like, 1 client: Firebird 15.4 transactions per second, PostgreSQL 42.0 transactions per second, PostgreSQL 2.7 times as much; FireDAC with FetchOptions.CursorKind = ckDefault, TPC-B like, 16 clients: Firebird 85.3 transactions per second, PostgreSQL 195 transactions per second, PostgreSQL 2.3 times as much</desc><style>text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}.bg{fill:#ffffff;stroke:#e2e8f0}.t1{fill:#020617}.t2{fill:#475569}.t3{fill:#64748b}.grid{stroke:#e2e8f0}.base{stroke:#cbd5e1}.fb{fill:#eb6834}.pg{fill:#2a78d6}.fbl{stroke:#eb6834}.pgl{stroke:#2a78d6}.ring{stroke:#ffffff}@media (prefers-color-scheme: dark){.bg{fill:#0f1620;stroke:#1f2937}.t1{fill:#ffffff}.t2{fill:#cbd5e1}.t3{fill:#94a3b8}.grid{stroke:#1f2937}.base{stroke:#334155}.fb{fill:#d95926}.pg{fill:#3987e5}.fbl{stroke:#d95926}.pgl{stroke:#3987e5}.ring{stroke:#0f1620}}</style><rect class="bg" x="0.5" y="0.5" width="759" height="1001" rx="12"/><text class="t1" x="24.0" y="36.0" font-size="18" font-weight="600">The same comparison with FireDAC</text><text class="t2" x="24.0" y="58.0" font-size="13">Windows 11 (VM), transactions per second, median of three rounds. Higher is better.</text>